name: Build & Push Docker Image

on:
  push:
    branches:
      - main
      - server
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - server
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: true
        type: boolean
        default: true
      deploy_coolify:
        description: 'Trigger Coolify deployment after build'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/server' }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL || '' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Deployment (Optional)
        if: |
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/server' || github.ref == 'refs/heads/main') &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy_coolify)
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "$COOLIFY_BASE_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "ℹ️ Coolify deployment secrets not fully configured (COOLIFY_BASE_URL, COOLIFY_TOKEN, COOLIFY_APP_UUID). Skipping Coolify trigger."
            exit 0
          fi

          CLEAN_BASE_URL="${COOLIFY_BASE_URL%/}"
          DEPLOY_URL="${CLEAN_BASE_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"

          echo "🚀 Triggering Coolify deployment webhook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${DEPLOY_URL}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Coolify HTTP Code: ${HTTP_CODE}"
          echo "Response: ${BODY}"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Coolify deployment successfully triggered!"
          else
            echo "⚠️ Warning: Coolify trigger returned status ${HTTP_CODE}. Check application webhook."
          fi
